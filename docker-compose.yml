services:
  postgres:
    image: postgres:16-alpine
    container_name: lasatrading-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-lasatrading}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lasatrading}
      POSTGRES_DB: ${DB_NAME:-lasatrading}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lasatrading}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lasatrading-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: